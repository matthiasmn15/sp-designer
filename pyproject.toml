[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sp-designer"
version = "0.1.0"
description = "Spark plug design and comparison tool for stationary gas engines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "mendeleev>=0.17",
    "httpx>=0.27",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sp-designer = "sp_designer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sp_designer = ["web/*", "data/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
